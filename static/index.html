<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영수증 자동화</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🧾 영수증 자동화</h1>
      <p>uploads 폴더에 파일을 넣고 → Cursor에서 "분석해줘" → 결과 불러오기</p>
    </header>

    <!-- Step 1: 폴더 스캔 -->
    <section id="step-scan" class="step">
      <div class="scan-info">
        <p>📁 <strong>uploads</strong> 폴더에 영수증 파일을 넣어주세요</p>
        <p class="small">지원 형식: PNG, JPG, JPEG, GIF, BMP, PDF</p>
      </div>
      <button type="button" id="btnScan" class="btn primary">폴더 스캔</button>
      <div id="scanResult" class="scan-result"></div>
    </section>

    <!-- Step 2: 슬라이드 입력 -->
    <section id="step-slides" class="step hidden">
      <div class="slide-header">
        <span id="slideCounter">1 / 1</span>
        <div>
          <button type="button" id="btnReload" class="btn secondary">결과 불러오기</button>
          <button type="button" id="btnReloadAll" class="btn secondary">전체 불러오기</button>
          <button type="button" id="btnShowList" class="btn secondary">리스트 보기</button>
        </div>
      </div>
      <div class="slide-content">
        <div class="receipt-preview">
          <img id="slideImage" src="" alt="영수증" />
          <p id="slideFilename" class="filename"></p>
        </div>
        <div class="receipt-form">
          <div class="field">
            <label>날짜 (YYMMDD)</label>
            <input type="text" id="fieldDate" placeholder="260127" />
          </div>
          <div class="field">
            <label>시간 (HHMMSS)</label>
            <input type="text" id="fieldTime" placeholder="090800" />
          </div>
          <div class="field">
            <label>결제처</label>
            <input type="text" id="fieldMerchant" placeholder="송강충전소" />
          </div>
          <div class="field">
            <label>비용 (숫자만)</label>
            <input type="text" id="fieldAmount" placeholder="43954" />
          </div>
          <div class="field">
            <label>사용자 작성란</label>
            <input type="text" id="fieldUserNotes" placeholder="예: 주차비" />
          </div>
          <div class="slide-nav">
            <button type="button" id="btnPrev" class="btn">이전</button>
            <button type="button" id="btnNext" class="btn primary">다음</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Step 3: 리스트 & 저장 -->
    <section id="step-list" class="step hidden">
      <h2>저장할 파일 목록</h2>
      <ul id="saveList"></ul>
      <div class="list-actions">
        <button type="button" id="btnBackToSlides" class="btn secondary">슬라이드로 돌아가기</button>
        <button type="button" id="btnSaveAll" class="btn primary">한 번에 저장</button>
      </div>
      <div id="saveResult" class="save-result hidden"></div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
